name: Update recent writing

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update the Recent Writing section from your RSS feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # TODO: replace with your real newsletter / Medium / blog RSS feed URL.
          # When the feed has posts, this workflow fills the
          # BLOG-POST-LIST markers in README.md automatically.
          feed_list: "https://YOUR-FEED-URL.xml"
